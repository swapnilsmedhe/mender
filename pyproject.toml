
[project]
name = "mender"
version = "0.1.0"
description = "AI-assisted security vulnerability remediation agent"
readme = "README.md"
authors = [
    { name = "Swapnil Medhe", email = "53039172+swapnilsmedhe@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "github-copilot-sdk>=1.0.0",
]

[project.scripts]
mender = "mender:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = ["mender", "security_agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
